plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.videoconverter'
version = '0.1.0'

android {
  namespace "expo.modules.videoconverter"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.arthenica:ffmpeg-kit-next:9.0.2'
}
